<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily To-Do</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f0f0f0}
.screen{display:none}.screen.active{display:block}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{background:#111;border:0.5px solid #222;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center}
.login-title{font-size:22px;font-weight:500;color:#f0f0f0;margin-bottom:6px}
.login-sub{font-size:14px;color:#555;margin-bottom:2rem}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;border-radius:8px;border:0.5px solid #2a2a2a;background:#141414;color:#ddd;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
.btn-google:hover{background:#1a1a1a;border-color:#444}
.btn-google svg{flex-shrink:0}
.login-error{font-size:13px;color:#E24B4A;margin-top:1rem;display:none}
.app-topbar{padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.user-info{display:flex;align-items:center;gap:8px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:#1D9E75;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#fff;overflow:hidden;flex-shrink:0}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-size:13px;color:#666}
.btn-signout{height:28px;padding:0 10px;font-size:12px;border-radius:6px;border:0.5px solid #2a2a2a;background:transparent;color:#555;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-signout:hover{color:#E24B4A;border-color:#4a1515;background:#2a0a0a}
.app-layout{display:flex;padding:0 1.5rem 2rem;gap:0;max-width:1200px;margin:0 auto;justify-content:center}
.panel-center{width:100%;max-width:600px;padding-right:1.5rem;flex-shrink:0}
.tab-row{display:flex;gap:2px;margin-bottom:1.25rem;border-bottom:0.5px solid #2a2a2a}
.tab{padding:8px 14px;font-size:13px;font-weight:400;color:#666;background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:color .15s}
.tab.active{color:#f0f0f0;font-weight:500;border-bottom:2px solid #1D9E75}
.tab:hover:not(.active){color:#ccc}
.panel{display:none}.panel.active{display:block}
.date-line{font-size:13px;color:#555;margin-bottom:4px}
.title{font-size:22px;font-weight:500;color:#f0f0f0;margin-bottom:1.25rem}
.sync-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;margin-bottom:.75rem;height:18px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s}
.sync-dot.synced{background:#1D9E75}.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}.sync-dot.error{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:5px}
.progress-label{font-size:13px;color:#666}.progress-pct{font-size:13px;font-weight:500;color:#f0f0f0}
.progress-track{height:6px;background:#1a1a1a;border-radius:99px;overflow:hidden;border:0.5px solid #2a2a2a;margin-bottom:1.25rem}
.progress-fill{height:100%;background:#1D9E75;border-radius:99px;transition:width .35s ease}
.input-row{display:flex;gap:8px;margin-bottom:1rem}
.input-row input{flex:1;height:40px;padding:0 12px;font-size:15px;border-radius:8px;border:0.5px solid #2a2a2a;background:#141414;color:#f0f0f0;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.input-row input:focus{box-shadow:0 0 0 2px #0F6E56;border-color:#1D9E75}
.input-row input::placeholder{color:#444}
.btn-add{height:40px;padding:0 18px;font-size:14px;font-weight:500;border-radius:8px;border:0.5px solid #1D9E75;background:#1D9E75;color:#fff;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
.btn-add:hover{background:#0F6E56;border-color:#0F6E56}
.task-list{display:flex;flex-direction:column;gap:6px;margin-bottom:1.25rem;min-height:40px}
.task-item{background:#111;border:0.5px solid #222;border-radius:8px;overflow:hidden;transition:transform .15s,box-shadow .15s,opacity .15s}
.task-main{display:flex;align-items:center;gap:10px;padding:10px 12px}
.task-item.done>.task-main .task-text{text-decoration:line-through;color:#444}
.task-item.done>.task-main{opacity:.5}
.checkbox{width:18px;height:18px;border-radius:4px;border:1.5px solid #333;background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.checkbox.checked{background:#1D9E75;border-color:#1D9E75}
.chk-svg{display:none;width:10px;height:7px}
.chk-svg path{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.checkbox.checked .chk-svg{display:block}
.task-text{flex:1;font-size:15px;color:#ddd;word-break:break-word}
.task-actions{display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s}
.task-item:hover .task-actions{opacity:1}
.icon-btn{width:26px;height:26px;border-radius:4px;border:none;background:transparent;cursor:pointer;color:#555;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:color .15s}
.icon-btn:hover{color:#ccc}.icon-btn.del:hover{color:#E24B4A}
.sub-count{font-size:11px;color:#555;margin-left:2px}
.subtask-area{padding:0 12px 10px 40px;display:flex;flex-direction:column;gap:4px}
.subtask-input-row{display:flex;gap:6px;margin-top:4px}
.subtask-input-row input{flex:1;height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:0.5px solid #2a2a2a;background:#0a0a0a;color:#ddd;font-family:inherit;outline:none}
.subtask-input-row input:focus{box-shadow:0 0 0 2px #0F6E56;border-color:#1D9E75}
.subtask-input-row input::placeholder{color:#444}
.btn-sub-add{height:30px;padding:0 10px;font-size:12px;border-radius:8px;border:0.5px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.btn-sub-add:hover{background:#1a1a1a;color:#ccc}
.subtask-item{display:flex;align-items:center;gap:8px;padding:4px 0}
.subtask-item .checkbox{width:14px;height:14px;border-radius:3px}
.subtask-text{flex:1;font-size:13px;color:#888}
.subtask-item.done .subtask-text{text-decoration:line-through;color:#444}
.subtask-del{width:20px;height:20px;border:none;background:transparent;cursor:pointer;color:#444;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.subtask-item:hover .subtask-del{opacity:1}
.subtask-del:hover{color:#E24B4A}
.footer{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:0.5px solid #1e1e1e}
.count-text{font-size:13px;color:#555}
.btn-reset{height:32px;padding:0 14px;font-size:13px;border-radius:8px;border:0.5px solid #2a2a2a;background:transparent;color:#666;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-reset:hover{background:#2a0a0a;color:#E24B4A;border-color:#4a1515}
.empty-state{text-align:center;padding:2.5rem 1rem;color:#444;font-size:14px}
.archive-filters{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.filter-btn{height:30px;padding:0 12px;font-size:13px;border-radius:99px;border:0.5px solid #2a2a2a;background:transparent;color:#666;cursor:pointer;font-family:inherit;transition:all .15s}
.filter-btn.active{background:#1D9E75;border-color:#1D9E75;color:#fff}
.filter-btn:hover:not(.active){background:#1a1a1a;color:#ccc}
.archive-group{margin-bottom:1.5rem}
.archive-group-label{font-size:12px;font-weight:500;color:#444;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.archive-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#111;border:0.5px solid #222;border-radius:8px;margin-bottom:5px}
.archive-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;flex-shrink:0;margin-top:5px}
.archive-content{flex:1}.archive-task{font-size:14px;color:#666;text-decoration:line-through}
.archive-sub{font-size:12px;color:#444;margin-top:2px}
.archive-date{font-size:12px;color:#444;flex-shrink:0}
.archive-title{font-size:22px;font-weight:500;color:#f0f0f0;margin-bottom:1.25rem}
.loading-msg{text-align:center;padding:2rem;color:#444;font-size:14px}
.drag-handle{width:26px;height:26px;border-radius:4px;border:none;background:transparent;cursor:grab;color:#333;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .15s;touch-action:none}
.drag-handle:hover{color:#666}.drag-handle:active{cursor:grabbing}
.task-item.dragging{opacity:.4;transform:scale(.97);box-shadow:0 0 0 1px #1D9E75}
.task-item.drag-over{border-color:#1D9E75;box-shadow:0 -2px 0 0 #1D9E75}
.task-item.drag-over-below{border-color:#1D9E75;box-shadow:0 2px 0 0 #1D9E75}

/* Calendar sidebar */
.cal-sidebar{width:240px;flex-shrink:0;border-left:0.5px solid #1e1e1e;padding:0 0 0 1.25rem;overflow-y:auto;max-height:calc(100vh - 60px);transition:width .25s ease}
.cal-sidebar.expanded{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-height:100vh;background:#0a0a0a;z-index:50;padding:1.5rem;border:none;overflow-y:auto}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.cal-top-title{font-size:14px;font-weight:500;color:#f0f0f0}
.cal-expand-btn{width:28px;height:28px;border-radius:6px;border:0.5px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-expand-btn:hover{background:#1a1a1a;color:#f0f0f0;border-color:#444}
.cal-nav{display:flex;align-items:center;gap:4px;margin-bottom:.75rem}
.cal-nav-btn{width:26px;height:26px;border-radius:6px;border:0.5px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav-btn:hover{background:#1a1a1a;color:#f0f0f0}
.cal-today-btn{height:26px;padding:0 10px;font-size:11px;border-radius:6px;border:0.5px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;font-family:inherit;transition:all .15s}
.cal-today-btn:hover{background:#1a1a1a;color:#f0f0f0}
.cal-week-label{flex:1;font-size:12px;color:#666;text-align:center}
.cal-mini-list{display:flex;flex-direction:column;gap:2px;margin-bottom:1rem}
.cal-mini-day{margin-bottom:6px}
.cal-mini-day-label{font-size:11px;font-weight:500;color:#555;margin-bottom:3px;padding:2px 0}
.cal-mini-day-label.today{color:#1D9E75}
.cal-mini-event{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#151515;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:background .1s}
.cal-mini-event:hover{background:#1a1a1a}
.cal-mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-mini-text{font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cal-mini-time{font-size:10px;color:#555;flex-shrink:0}
.cal-mini-empty{font-size:11px;color:#333;padding:2px 0}
.cal-mini-add{display:flex;align-items:center;gap:4px;font-size:11px;color:#444;cursor:pointer;padding:3px 8px;border-radius:6px;transition:color .15s}
.cal-mini-add:hover{color:#1D9E75}
.cal-full{display:none}
.cal-sidebar.expanded .cal-full{display:block}
.cal-sidebar.expanded .cal-mini-list{display:none}
.cal-grid{display:grid;grid-template-columns:48px repeat(7,1fr);border:0.5px solid #222;border-radius:8px;overflow:hidden;background:#111;position:relative}
.cal-day-header{padding:8px 4px;text-align:center;font-size:11px;font-weight:500;color:#555;background:#0e0e0e;border-bottom:0.5px solid #222;border-left:0.5px solid #222}
.cal-day-header.today-col{color:#1D9E75}
.cal-day-num{display:block;font-size:14px;font-weight:500;color:#888;margin-top:2px}
.cal-day-header.today-col .cal-day-num{color:#1D9E75}
.cal-corner{background:#0e0e0e;border-bottom:0.5px solid #222}
.cal-time{padding:0 4px;font-size:10px;color:#444;text-align:right;border-right:0.5px solid #222;height:48px;display:flex;align-items:flex-start;justify-content:flex-end;padding-top:2px}
.cal-cell{height:48px;border-left:0.5px solid #1e1e1e;border-bottom:0.5px solid #1e1e1e;position:relative;cursor:pointer;transition:background .1s}
.cal-cell:hover{background:#151515}
.cal-cell.today-col{background:#0d1a15}.cal-cell.today-col:hover{background:#0f2018}
.cal-event{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 5px;font-size:11px;font-weight:500;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:2;transition:opacity .15s;line-height:1.3}
.cal-event:hover{opacity:.85}
.cal-legend{display:flex;flex-direction:column;gap:3px;margin-bottom:.5rem}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#666;padding:3px 0}
.cal-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-add-cat{font-size:11px;color:#555;cursor:pointer;padding:4px 0;transition:color .15s;display:flex;align-items:center;gap:4px;margin-bottom:.75rem}
.cal-add-cat:hover{color:#1D9E75}
.cal-legend-remove{width:14px;height:14px;border:none;background:transparent;color:#444;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,color .15s;margin-left:auto}
.cal-legend-item:hover .cal-legend-remove{opacity:1}
.cal-legend-remove:hover{color:#E24B4A}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:#111;border:0.5px solid #2a2a2a;border-radius:12px;width:100%;max-width:420px;padding:1.5rem;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:500;color:#f0f0f0;margin-bottom:1.25rem}
.modal-field{margin-bottom:.75rem}
.modal-label{font-size:12px;color:#666;margin-bottom:4px;display:block}
.modal-input{width:100%;height:36px;padding:0 10px;font-size:14px;border-radius:8px;border:0.5px solid #2a2a2a;background:#0a0a0a;color:#f0f0f0;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.modal-input:focus{box-shadow:0 0 0 2px #0F6E56;border-color:#1D9E75}
.modal-input::placeholder{color:#444}
.modal-textarea{width:100%;height:64px;padding:8px 10px;font-size:13px;border-radius:8px;border:0.5px solid #2a2a2a;background:#0a0a0a;color:#f0f0f0;font-family:inherit;outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s}
.modal-textarea:focus{box-shadow:0 0 0 2px #0F6E56;border-color:#1D9E75}
.modal-textarea::placeholder{color:#444}
select.modal-input{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23666' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;cursor:pointer}
.modal-row{display:flex;gap:8px}
.modal-row .modal-field{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
.modal-btn{height:34px;padding:0 16px;font-size:13px;font-weight:500;border-radius:8px;border:0.5px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;font-family:inherit;transition:all .15s}
.modal-btn:hover{background:#1a1a1a;color:#ccc}
.modal-btn.primary{background:#1D9E75;border-color:#1D9E75;color:#fff}
.modal-btn.primary:hover{background:#0F6E56}
.modal-btn.danger{color:#E24B4A;border-color:#4a1515}
.modal-btn.danger:hover{background:#2a0a0a}
.cat-color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cat-color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .1s}
.cat-color-swatch:hover{transform:scale(1.1)}
.cat-color-swatch.selected{border-color:#fff}
@media(max-width:860px){.app-layout{flex-direction:column}.panel-center{max-width:100%;padding-right:0}.cal-sidebar{width:100%;border-left:none;border-top:0.5px solid #1e1e1e;padding:1rem 0 0;max-height:none}}
</style>
</head>
<body>
<div class="screen active" id="screen-login">
  <div class="login-wrap"><div class="login-card">
    <div class="login-title">Daily To-Do</div>
    <div class="login-sub">Sign in to access your tasks</div>
    <button class="btn-google" id="btn-google"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>Continue with Google</button>
    <div class="login-error" id="login-error">Something went wrong. Please try again.</div>
  </div></div>
</div>
<div class="screen" id="screen-app">
  <div class="app-topbar">
    <div class="user-info"><div class="user-avatar" id="user-avatar"></div><span class="user-name" id="user-name"></span></div>
    <button class="btn-signout" id="btn-signout">Sign out</button>
  </div>
  <div class="app-layout">
    <div class="panel-center">
      <div class="tab-row"><button class="tab active" data-tab="todo">Today</button><button class="tab" data-tab="archive">Archive</button></div>
      <div class="panel active" id="panel-todo">
        <div class="date-line" id="date-line"></div>
        <div class="title">Today's tasks</div>
        <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Connecting…</span></div>
        <div class="progress-meta"><span class="progress-label">Progress</span><span class="progress-pct" id="pct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="fill" style="width:0%"></div></div>
        <div class="input-row"><input type="text" id="task-input" placeholder="Add a new task…" maxlength="140"/><button class="btn-add" id="btn-add">Add</button></div>
        <div class="task-list" id="task-list"><div class="loading-msg">Loading tasks…</div></div>
        <div class="footer"><span class="count-text" id="count-text">No tasks yet</span><button class="btn-reset" id="btn-reset">Archive completed</button></div>
      </div>
      <div class="panel" id="panel-archive">
        <div class="archive-title">Archive</div>
        <div class="archive-filters"><button class="filter-btn active" data-range="day">Today</button><button class="filter-btn" data-range="week">Past week</button><button class="filter-btn" data-range="month">Past month</button><button class="filter-btn" data-range="all">All time</button></div>
        <div id="archive-list"></div>
      </div>
    </div>
    <div class="cal-sidebar" id="cal-sidebar">
      <div class="cal-top"><span class="cal-top-title">Calendar</span><button class="cal-expand-btn" id="cal-expand" title="Expand"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 5V1h4M13 5V1H9M1 9v4h4M13 9v4H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M7 1L3 5l4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="cal-week-label" id="cal-week-label">This week</span>

/* ===== CALENDAR ===== */
function getWeekDays(o){const d=new Date();d.setDate(d.getDate()-d.getDay()+o*7);d.setHours(0,0,0,0);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function fmtHour(h){return(h%12||12)+' '+(h>=12?'PM':'AM')}
function fmtTimeShort(t){const[h,m]=parseTime(t);return(h%12||12)+':'+(m<10?'0':'')+m+(h>=12?'p':'a')}
function getCalColor(name){const c=calendars.find(x=>x.name===name);return c?c.color:'#555'}

/* Parse time string - handles both "HH:MM" and "HH:MM:SS+00" (timetz) formats.
   We always want the literal time the user entered, not UTC-shifted. */
function parseTime(t){
  if(!t)return[0,0];
  /* Strip timezone offset if present (e.g. "12:00:00+00" or "12:00:00-07:00") */
  const clean=t.replace(/[+-]\d{2}(:\d{2})?$/,'');
  const parts=clean.split(':').map(Number);
  return[parts[0]||0,parts[1]||0];
}

function renderFullGrid(){
  const days=getWeekDays(weekOffset),now=new Date(),grid=document.getElementById('cal-grid');grid.innerHTML='';
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const corner=document.createElement('div');corner.className='cal-corner';grid.appendChild(corner);
  days.forEach((d,di)=>{const h=document.createElement('div');h.className='cal-day-header'+(isSameDay(d,now)?' today-col':'');h.innerHTML=dn[di]+'<span class="cal-day-num">'+d.getDate()+'</span>';grid.appendChild(h)});
  for(let h=HOURS_START;h<HOURS_END;h++){const t=document.createElement('div');t.className='cal-time';t.textContent=fmtHour(h);grid.appendChild(t);days.forEach(d=>{const cell=document.createElement('div');cell.className='cal-cell'+(isSameDay(d,now)?' today-col':'');cell.addEventListener('click',()=>openNewEvent(d,h));grid.appendChild(cell)})}
  /* Defer event placement so grid has rendered and dimensions are available */
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{placeGridEvents(days,grid)})});
}
function placeGridEvents(days,grid){
  document.querySelectorAll('.cal-event').forEach(e=>e.remove());
  if(!grid.offsetWidth)return;
  const hdrEl=grid.children[1];const timeEl=grid.querySelector('.cal-time');
  if(!hdrEl||!timeEl)return;
  const hdrH=hdrEl.offsetTop+hdrEl.offsetHeight-grid.offsetTop;
  const tW=timeEl.offsetWidth;
  const cW=(grid.offsetWidth-tW)/7;
  const cH=48;
  calEvents.forEach(ev=>{
    const evD=new Date(ev.event_date+'T00:00:00'),di=days.findIndex(d=>isSameDay(d,evD));if(di===-1)return;
    const[sh,sm]=parseTime(ev.start_time),[eh,em]=parseTime(ev.end_time);
    const sH=sh+sm/60,eH=eh+em/60;if(eH<=HOURS_START||sH>=HOURS_END)return;
    const cS=Math.max(sH,HOURS_START),cE=Math.min(eH,HOURS_END);
    const el=document.createElement('div');el.className='cal-event';
    el.style.cssText='top:'+Math.round(hdrH+(cS-HOURS_START)*cH+1)+'px;left:'+Math.round(tW+di*cW+2)+'px;width:'+Math.round(cW-4)+'px;height:'+Math.max(Math.round((cE-cS)*cH)-2,18)+'px;background:'+getCalColor(ev.calendar);
    el.textContent=ev.title;el.addEventListener('click',e=>{e.stopPropagation();openEditEvent(ev)});grid.appendChild(el);
  });
}

}

function openNewEvent(date,hour){
  editingEventId=null;document.getElementById('modal-title').textContent='New event';
  document.getElementById('ev-name').value='';document.getElementById('ev-date').value=date.getFullYear()+'-'+pad2(date.getMonth()+1)+'-'+pad2(date.getDate());
  document.getElementById('ev-start').value=pad2(hour)+':00';document.getElementById('ev-end').value=pad2(Math.min(hour+1,23))+':00';
  document.getElementById('ev-cal').value=calendars[0]?.name||'';document.getElementById('ev-reminder').value='';
  document.getElementById('ev-link').value='';document.getElementById('ev-notes').value='';document.getElementById('ev-delete').style.display='none';
  document.getElementById('event-modal').classList.add('open');setTimeout(()=>document.getElementById('ev-name').focus(),100);
}
function openEditEvent(ev){
  editingEventId=ev.id;document.getElementById('modal-title').textContent='Edit event';
  document.getElementById('ev-name').value=ev.title;document.getElementById('ev-date').value=ev.event_date;
  const[esh,esm]=parseTime(ev.start_time);const[eeh,eem]=parseTime(ev.end_time);
  document.getElementById('ev-start').value=pad2(esh)+':'+pad2(esm);document.getElementById('ev-end').value=pad2(eeh)+':'+pad2(eem);
  document.getElementById('ev-cal').value=ev.calendar||calendars[0]?.name||'';
  document.getElementById('ev-reminder').value=ev.reminder_minutes!=null?String(ev.reminder_minutes):'';
  document.getElementById('ev-link').value=ev.link||'';document.getElementById('ev-notes').value=ev.notes||'';
  document.getElementById('ev-delete').style.display='inline-flex';document.getElementById('event-modal').classList.add('open');
}
document.getElementById('ev-cancel').addEventListener('click',()=>document.getElementById('event-modal').classList.remove('open'));
document.getElementById('event-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('event-modal').classList.remove('open')});
document.getElementById('ev-save').addEventListener('click',async()=>{
  const title=document.getElementById('ev-name').value.trim();if(!title){document.getElementById('ev-name').focus();return}
  const p={title,event_date:document.getElementById('ev-date').value,start_time:document.getElementById('ev-start').value,end_time:document.getElementById('ev-end').value,calendar:document.getElementById('ev-cal').value,reminder_minutes:document.getElementById('ev-reminder').value===''?null:parseInt(document.getElementById('ev-reminder').value),link:document.getElementById('ev-link').value.trim()||null,notes:document.getElementById('ev-notes').value.trim()||null,user_id:currentUser.id};
  setSyncStatus('syncing');const{error}=editingEventId?await supabase.from('events').update(p).eq('id',editingEventId):await supabase.from('events').insert(p);
  if(error){setSyncStatus('error');return}document.getElementById('event-modal').classList.remove('open');editingEventId=null;await loadCalEvents();setSyncStatus('synced');
});
document.getElementById('ev-delete').addEventListener('click',async()=>{if(!editingEventId||!confirm('Delete this event?'))return;setSyncStatus('syncing');await supabase.from('events').delete().eq('id',editingEventId);document.getElementById('event-modal').classList.remove('open');editingEventId=null;await loadCalEvents();setSyncStatus('synced')});

/* Category modal */
let selCatColor=COLOR_PALETTE[0];
function renderCatColors(){const row=document.getElementById('cat-color-row');row.innerHTML='';const used=calendars.map(c=>c.color);COLOR_PALETTE.forEach(c=>{const sw=document.createElement('div');sw.className='cat-color-swatch'+(c===selCatColor?' selected':'');sw.style.background=c;if(used.includes(c))sw.style.opacity='.3';sw.addEventListener('click',()=>{selCatColor=c;renderCatColors()});row.appendChild(sw)})}
document.getElementById('cal-add-cat').addEventListener('click',()=>{if(calendars.length>=5)return;document.getElementById('cat-name').value='';selCatColor=COLOR_PALETTE.find(c=>!calendars.some(x=>x.color===c))||COLOR_PALETTE[0];renderCatColors();document.getElementById('cat-modal').classList.add('open');setTimeout(()=>document.getElementById('cat-name').focus(),100)});
document.getElementById('cat-cancel').addEventListener('click',()=>document.getElementById('cat-modal').classList.remove('open'));
document.getElementById('cat-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('cat-modal').classList.remove('open')});
document.getElementById('cat-save').addEventListener('click',()=>{const n=document.getElementById('cat-name').value.trim();if(!n)return;if(calendars.some(c=>c.name.toLowerCase()===n.toLowerCase())){alert('Name already exists.');return}calendars.push({name:n,color:selCatColor});saveCals(calendars);renderLegend();populateCalSel();document.getElementById('cat-modal').classList.remove('open')});

/* Expand / collapse */
document.getElementById('cal-expand').addEventListener('click',()=>{const sb=document.getElementById('cal-sidebar');if(sb.classList.contains('expanded')){sb.classList.remove('expanded');document.getElementById('cal-expand').innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 5V1h4M13 5V1H9M1 9v4h4M13 9v4H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}else{sb.classList.add('expanded');document.getElementById('cal-expand').innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 1L1 1 1 5M9 1l4 0 0 4M5 13H1V9M9 13h4V9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';renderFullGrid()}});

document.getElementById('cal-prev').addEventListener('click',()=>{weekOffset--;loadCalEvents()});
document.getElementById('cal-next').addEventListener('click',()=>{weekOffset++;loadCalEvents()});
document.getElementById('cal-today').addEventListener('click',()=>{weekOffset=0;loadCalEvents()});

/* Tabs */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active');if(t.dataset.tab==='archive')renderArchive()}));
document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');archiveRange=b.dataset.range;renderArchive()}));

/* Realtime */
function setupRealtime(){
  if(realtimeChannel)supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase.channel('tasks-ch').on('postgres_changes',{event:'*',schema:'public',table:'tasks',filter:'user_id=eq.'+currentUser.id},()=>loadTasks()).subscribe();
  if(calendarReady){if(calRealtimeChannel)supabase.removeChannel(calRealtimeChannel);calRealtimeChannel=supabase.channel('events-ch').on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'user_id=eq.'+currentUser.id},()=>loadCalEvents()).subscribe()}
}

function setUserUI(user){
  currentUser=user;document.getElementById('user-name').textContent=user.user_metadata?.full_name||user.email;
  const av=document.getElementById('user-avatar');if(user.user_metadata?.avatar_url)av.innerHTML='<img src="'+user.user_metadata.avatar_url+'" alt=""/>';else av.textContent=(user.email||'U')[0].toUpperCase();
  document.getElementById('date-line').textContent=todayStr();calendars=loadCals();renderLegend();populateCalSel();
  show('screen-app');loadTasks();checkEventsTable().then(()=>{loadCalEvents();setupRealtime()});
}

document.getElementById('btn-google').addEventListener('click',async()=>{const{error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://terradrafting.github.io/todo'}});if(error)document.getElementById('login-error').style.display='block'});
document.getElementById('btn-signout').addEventListener('click',async()=>{await supabase.auth.signOut();tasks=[];expandedTasks.clear();calEvents=[];show('screen-login')});

const{data:{session}}=await supabase.auth.getSession();
if(session?.user)setUserUI(session.user);
supabase.auth.onAuthStateChange((_ev,session)=>{if(session?.user)setUserUI(session.user)});
</script>
